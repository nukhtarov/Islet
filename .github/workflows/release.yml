# Builds Islet.app and publishes a GitHub release when a version tag is pushed.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        run: ditto -c -k --keepParent Islet.app "Islet-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Islet-${GITHUB_REF_NAME}.zip" \
            --title "Islet ${GITHUB_REF_NAME}" \
            --generate-notes
